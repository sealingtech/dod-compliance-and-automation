############################################
# vmAdvSettingsRemove
# Setting must not exist at all.
#
# No pwsh needed: reconfiguring a VM with an advanced setting whose value
# is an empty string deletes that key from the vmx rather than setting it,
# so this can go through the same module as every other advanced setting.
############################################

- name: VMCH-80-000199 - Shared salt values must be disabled on the virtual machine
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    name: "{{ item[:] }}"
    validate_certs: "{{ validate_certs }}"
    advanced_settings:
      - key: sched.mem.pshare.salt
