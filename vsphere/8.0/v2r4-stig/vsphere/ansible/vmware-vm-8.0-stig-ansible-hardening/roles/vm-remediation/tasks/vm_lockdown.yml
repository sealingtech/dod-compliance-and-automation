  tags:
    - VMCH-80-000199

############################################
# ConfigSpec fields with no community.vmware equivalent
#
# migrateEncryption, ftEncryptionMode, and flags.enableLogging are
# first-class VirtualMachineConfigSpec properties, not extraConfig entries,
# so they can't be set through vmware_guest's advanced_settings. There is
# no dedicated community.vmware module for them either.
#
# Instead of PowerCLI/pwsh, these call a small pyVmomi (pure Python)
# script that talks to the vSphere API directly - see files/vmware_vm_configspec.py.
# pyVmomi is already a dependency of the community.vmware collection used
# above, so no new tooling is introduced.
############################################



