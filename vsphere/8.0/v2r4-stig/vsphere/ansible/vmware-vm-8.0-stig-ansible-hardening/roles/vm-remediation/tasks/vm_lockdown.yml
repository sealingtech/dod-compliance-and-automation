---
# VMware vSphere 8.0 Virtual Machine STIG Remediation
# Converted from: VMware_vSphere_8.0_VM_STIG_Remediation.ps1 (v2.0.1)
#
# NOT remediated here (require VM powered off or environment-specific review),
# matching the source script's exclusion list:
#   VMCH-80-000200, VMCH-80-000208, VMCH-80-000209, VMCH-80-000210,
#   VMCH-80-000211, VMCH-80-000212, VMCH-80-000213, VMCH-80-000214

- name: Get All VM Hostnames Part 1 of 2
  ansible.builtin.shell:
    cmd: |
      Connect-VIServer -Server {{ vcenter_hostname }} -User '{{ vcenter_username }}' -Password '{{ vcenter_password }}';
      $exclusion_list = "{{ exclusion_list }}";
      $vms = Get-VM | where {$_.name -notMatch $exclusion_list} | Select-Object -ExpandProperty Name;
      $vms | Out-File /tmp/vm_machines.txt
  when:
    - get_vms | bool
  args:
    executable: /usr/bin/pwsh
  tags:
    - always

- name: Get All VM Hostnames Part 2 of 2
  ansible.builtin.shell:
    cmd: cat /tmp/vm_machines.txt
  register: vm_machines
  when:
    - vm_list is defined
  args:
    executable: /usr/bin/bash
  tags:
    - always

############################################
# vmAdvSettingsMayExist
# Settings that are compliant-by-default if absent, but must equal the
# given value if present. Mirrors the PS "MayExist" loop.
############################################

- name: VMCH-80-000189 - Copy operations must be disabled on the virtual machine
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    name: "{{ item[:] }}"
    validate_certs: "{{ validate_certs }}"
    advanced_settings:
      - key: isolation.tools.copy.disable
        value: "TRUE"
  with_items:
    - "{{ vm_machines.stdout_lines }}"
  when:
    - vmch_80_000189 | bool
  tags:
    - VMCH-80-000189

